services:
  # Resident History API - the official, unmodified data-pack/services/history_service.py,
  # started via deploy/run_history_service.py (see that file's docstring for why a
  # wrapper is used instead of editing the official script). Reachable at its public
  # onrender.com URL (see HISTORY_SERVICE_URL below) - Render's free "web" plan has no
  # private-only service type, and free-tier private networking between two web
  # services was tried and did not resolve in production; see DECISIONS.md >
  # "Deployment" for the full history.
  - type: web
    name: caseworker-history-service
    runtime: python
    plan: free
    buildCommand: echo "history service is Python stdlib only - nothing to install"
    startCommand: python deploy/run_history_service.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # FastAPI backend, also serving the static frontend/ (same as local: one process,
  # see backend/app/main.py's StaticFiles mount).
  - type: web
    name: caseworker-morning-agent
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HISTORY_SERVICE_URL
        # fromService/hostport (private networking) produced a hostname the backend
        # could not resolve in production - confirmed live: every referral failed with
        # "[Errno -2] Name or service not known". Using the History Service's public
        # URL instead; history_client.py already accepts a full https:// URL
        # unchanged, so no code change was needed for this fix.
        value: https://caseworker-history-service.onrender.com
